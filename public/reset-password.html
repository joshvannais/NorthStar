<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <script>
    (function () {
      var values = new URLSearchParams(window.location.search).getAll('token');
      var token = values.length === 1 && /^[A-Za-z0-9_-]{43}$/.test(values[0]) ? values[0] : '';
      window.history.replaceState(null, '', '/reset-password');
      document.addEventListener('DOMContentLoaded', function () {
        var form = document.getElementById('resetForm');
        var status = document.getElementById('resetStatus');
        if (!token) {
          token = '';
          form.hidden = true;
          status.textContent = 'This reset link is invalid or expired.';
          return;
        }
        form.addEventListener('submit', function (event) {
          event.preventDefault();
          var button = event.currentTarget.querySelector('button');
          button.disabled = true;
          fetch('/api/auth/reset-password', {
            method: 'POST', credentials: 'same-origin', referrerPolicy: 'no-referrer',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, password: document.getElementById('password').value })
          }).then(function (response) {
            token = '';
            return response.json().catch(function () { return {}; }).then(function (body) {
              if (!response.ok) throw new Error(body.error || 'Reset failed');
              status.textContent = 'Password reset. Sign in with your new password.';
              form.hidden = true;
            });
          }).catch(function () {
            token = '';
            form.hidden = true;
            status.textContent = 'This reset link is invalid or expired.';
          }).finally(function () { button.disabled = false; });
        }, { once: true });
      }, { once: true });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | NorthStar</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-page"><section class="auth-card" aria-labelledby="resetTitle">
    <h1 id="resetTitle">Choose a new password</h1>
    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password">
      <button class="btn btn-primary" type="submit">Reset password</button>
    </form>
    <p id="resetStatus" role="status" aria-live="polite"></p>
    <p><a href="/login">Return to sign in</a></p>
  </section></main>
</body>
</html>
