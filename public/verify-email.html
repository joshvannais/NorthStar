<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <script>
    (function () {
      var values = new URLSearchParams(window.location.search).getAll('token');
      var token = values.length === 1 && /^[A-Za-z0-9_-]{43}$/.test(values[0]) ? values[0] : '';
      window.history.replaceState(null, '', '/verify-email');
      document.addEventListener('DOMContentLoaded', function () {
        var card = document.getElementById('verifyCard');
        var title = document.getElementById('verifyTitle');
        var status = document.getElementById('verifyStatus');
        function showFailure() {
          card.setAttribute('data-state', 'failure');
          title.textContent = 'Verification link unavailable';
          status.textContent = 'This verification link is invalid or expired.';
        }
        if (!token) {
          showFailure();
          token = '';
          return;
        }
        fetch('/api/auth/verify-email', {
          method: 'POST', credentials: 'same-origin', referrerPolicy: 'no-referrer',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token })
        }).then(function (response) {
          token = '';
          return response.json().catch(function () { return {}; }).then(function (body) {
            if (!response.ok) throw new Error(body.error || 'Verification failed');
            card.setAttribute('data-state', 'success');
            title.textContent = 'Email verified';
            status.textContent = 'Your organization\'s 14-day trial has started.';
          });
        }).catch(function () {
          token = '';
          showFailure();
        });
      }, { once: true });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | NorthStar</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/site-professionalism.css">
</head>
<body class="verification-page">
  <header class="verification-brand" aria-label="NorthStar">
    <a href="/" class="verification-brand-link">
      <img src="/assets/logo.png" alt="" class="verification-brand-logo">
      <span>NorthStar</span>
    </a>
  </header>
  <main class="verification-shell">
    <section class="verification-card" id="verifyCard" data-state="checking" aria-labelledby="verifyTitle">
      <div class="verification-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path class="verification-check" d="M5 12.5l4.2 4.2L19 7"></path>
          <path class="verification-alert" d="M12 7v6m0 4h.01"></path>
        </svg>
      </div>
      <p class="verification-eyebrow">NorthStar account</p>
      <h1 id="verifyTitle">Checking your email</h1>
      <p id="verifyStatus" role="status" aria-live="polite" aria-atomic="true">Checking your verification link&hellip;</p>
      <a href="/login" class="btn verification-action" id="verifySignIn">Sign in to NorthStar</a>
      <p class="verification-help">You can safely close this page without signing in.</p>
    </section>
  </main>
</body>
</html>
