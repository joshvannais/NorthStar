<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | NorthStar</title><link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-page"><section class="auth-card" aria-labelledby="resetTitle">
    <h1 id="resetTitle">Choose a new password</h1>
    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" minlength="12" maxlength="128" required autocomplete="new-password">
      <button class="btn btn-primary" type="submit">Reset password</button>
    </form>
    <p id="resetStatus" role="status" aria-live="polite"></p>
    <p><a href="/login">Return to sign in</a></p>
  </section></main>
  <script>
    (function () {
      var token = new URLSearchParams(window.location.search).get('token') || '';
      history.replaceState(null, '', '/reset-password');
      document.getElementById('resetForm').addEventListener('submit', function (event) {
        event.preventDefault();
        var button = event.currentTarget.querySelector('button');
        button.disabled = true;
        fetch('/api/auth/reset-password', {
          method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: document.getElementById('password').value })
        }).then(function (response) { token = ''; return response.json().then(function (body) {
          if (!response.ok) throw new Error(body.error || 'Reset failed');
          document.getElementById('resetStatus').textContent = 'Password reset. Sign in with your new password.';
          document.getElementById('resetForm').hidden = true;
        }); }).catch(function () {
          token = '';
          document.getElementById('resetStatus').textContent = 'This reset link is invalid or expired.';
        }).finally(function () { button.disabled = false; });
      });
    })();
  </script>
</body>
</html>
