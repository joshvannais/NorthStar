<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <script>
    (function () {
      var values = new URLSearchParams(window.location.search).getAll('token');
      var token = values.length === 1 && /^[A-Za-z0-9_-]{43}$/.test(values[0]) ? values[0] : '';
      window.history.replaceState(null, '', '/reset-password');
      document.addEventListener('DOMContentLoaded', function () {
        var form = document.getElementById('resetForm');
        var status = document.getElementById('resetStatus');
        if (!token) {
          token = '';
          form.hidden = true;
          status.setAttribute('data-state', 'error');
          status.textContent = 'This reset link is invalid or expired.';
          return;
        }
        function submitReset(event) {
          event.preventDefault();
          if (!window.NorthStarPasswordFields ||
              !window.NorthStarPasswordFields.validateConfirmation(form)) return;
          form.removeEventListener('submit', submitReset);
          var button = form.querySelector('button[type="submit"]');
          var originalLabel = button.textContent;
          button.disabled = true;
          button.textContent = 'Resetting…';
          form.setAttribute('aria-busy', 'true');
          fetch('/api/auth/reset-password', {
            method: 'POST', credentials: 'same-origin', referrerPolicy: 'no-referrer',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, password: document.getElementById('password').value })
          }).then(function (response) {
            token = '';
            return response.json().catch(function () { return {}; }).then(function (body) {
              if (!response.ok) throw new Error(body.error || 'Reset failed');
              status.setAttribute('data-state', 'success');
              status.textContent = 'Password reset. Sign in with your new password.';
              form.hidden = true;
            });
          }).catch(function () {
            token = '';
            form.hidden = true;
            status.setAttribute('data-state', 'error');
            status.textContent = 'This reset link is invalid or expired.';
          }).finally(function () {
            button.disabled = false;
            button.textContent = originalLabel;
            form.removeAttribute('aria-busy');
          });
        }
        form.addEventListener('submit', submitReset);
      }, { once: true });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | NorthStar</title>
  <script src="/js/theme.js"></script>
  <script src="/js/password-fields.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/site-professionalism.css">
</head>
<body class="account-auth-page">
  <header class="account-auth-brand" aria-label="NorthStar">
    <a href="/"><img src="/assets/logo.png" alt=""><span>NorthStar</span></a>
  </header>
  <main class="account-auth-shell">
    <section class="account-auth-card" aria-labelledby="resetTitle">
      <p class="account-auth-eyebrow">NorthStar account</p>
      <h1 id="resetTitle">Choose a new password</h1>
      <p class="account-auth-support">Create a new password for your NorthStar account.</p>
      <form id="resetForm" class="account-auth-form" method="post" action="/reset-password">
        <div class="account-auth-field">
          <label for="password">New password</label>
          <div class="password-input-shell">
            <input id="password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" aria-describedby="passwordPolicyHint">
            <button type="button" class="password-visibility-toggle" data-password-toggle aria-controls="password" aria-pressed="false" aria-label="New password visibility">Show</button>
          </div>
          <p id="passwordPolicyHint" class="password-field-hint">Use 8 to 128 characters.</p>
        </div>
        <div class="account-auth-field">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-input-shell">
            <input id="confirmPassword" type="password" minlength="8" maxlength="128" required autocomplete="new-password" data-password-confirmation-for="password" aria-describedby="passwordMatchError" aria-errormessage="passwordMatchError" aria-invalid="false">
            <button type="button" class="password-visibility-toggle" data-password-toggle aria-controls="confirmPassword" aria-pressed="false" aria-label="Confirm password visibility">Show</button>
          </div>
          <p id="passwordMatchError" class="password-field-error" role="alert" aria-live="polite" hidden></p>
        </div>
        <button class="btn btn-primary" type="submit">Reset password</button>
      </form>
      <p id="resetStatus" class="account-auth-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <p class="account-auth-return"><a href="/login">Return to sign in</a></p>
    </section>
  </main>
</body>
</html>
