<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your account — NorthStar</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/auth-session.js"></script>
  <script src="/js/trial-status.js"></script>
</head>
<body class="standalone-page">
  <header class="standalone-brand" aria-label="NorthStar">
    <a href="/"><img src="/assets/logo.png" alt=""><span>NorthStar</span></a>
  </header>
  <main class="standalone-shell">
    <section class="standalone-card" aria-labelledby="pendingTitle">
      <img src="/assets/logo.png" alt="">
      <p class="standalone-eyebrow">NorthStar account</p>
      <h1 id="pendingTitle">Verify your email to continue</h1>
      <p class="standalone-support">Verify your email to begin your organization&rsquo;s 14-day trial and continue account setup.</p>
      <p id="verificationIdentity" class="standalone-identity"></p>
      <button class="btn btn-ghost" type="button" data-account-logout>Sign out</button>
    </section>
  </main>
  <script>
    NorthStarAccountSession.load().then(function(account) {
      document.getElementById('verificationIdentity').textContent = account.user.email || '';
    }).catch(function() {});
  </script>
</body>
</html>
