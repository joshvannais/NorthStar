<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — NorthStar AI</title>
  <meta name="description" content="Sign in to NorthStar or explore the account-free product demo.">
  <link rel="canonical" href="https://northstar-os.ai/login">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/auth-session.js"></script>
  <script src="/js/password-fields.js"></script>
  <link rel="stylesheet" href="/css/site-professionalism.css">
  <link rel="stylesheet" href="/css/public-site.css">
</head>
<body class="public-site-page">

  <nav class="nav" aria-label="Public navigation">
    <div class="nav-inner">
      <a href="/" class="nav-logo northstar-lockup" aria-label="NorthStar homepage">
        <img src="/assets/logo.png" alt="" class="logo-img">
        NorthStar
      </a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/signup" class="btn btn-primary btn-sm">Start Free Trial</a>
      </div>
      <span class="northstar-theme-slot" data-northstar-theme-slot></span>
    </div>
  </nav>

  <main style="min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:24px 16px;">
    <div style="width:100%;max-width:400px;">
      <div style="text-align:center;margin-bottom:28px;">
        <h1 style="font-size:22px;font-weight:700;margin-bottom:4px;">Welcome back</h1>
        <p style="color:var(--neutral-500);font-size:14px;">Sign in to your account</p>
      </div>

      <form id="loginForm" style="display:flex;flex-direction:column;gap:14px;">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input-shell">
            <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="password-visibility-toggle" data-password-toggle aria-controls="password" aria-pressed="false" aria-label="Password visibility">Show</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign In</button>
      </form>
      <p class="auth-recovery"><a class="auth-recovery-link" href="/forgot-password">Forgot your password?</a></p>

      <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--neutral-500);">
        Don't have an account? <a href="/signup" style="color:var(--brand-600);font-weight:600;text-decoration:none;">Create one</a>
      </p>
      <p style="text-align:center;margin-top:10px;font-size:13px;color:var(--neutral-500);">
        Just exploring? <a href="/demo" style="color:var(--brand-600);font-weight:600;text-decoration:none;">Open the account-free demo</a>
      </p>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const account = await NorthStarAccountSession.login(email, password);
        window.location.href = NorthStarAccountSession.destination(account);
      } catch (err) {
        showToast(err.message || 'Login failed. Please try again.');
      }
    });
  </script>
  <footer class="footer">
  <div class="footer-links">
    <a href="/">Home</a>
    <a href="/#pricing">Pricing</a>
    <a href="/faq">FAQ</a>
    <a href="/contact">Contact</a>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="/refund">Refunds</a>
    <a href="/legal">Legal</a>
  </div>
  <p>© 2026 NorthStar Solutions LLC. All rights reserved.</p>
  </footer>
</body>
</html>
