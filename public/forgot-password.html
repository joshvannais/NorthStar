<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | NorthStar</title><link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-page"><section class="auth-card" aria-labelledby="forgotTitle">
    <h1 id="forgotTitle">Reset your password</h1>
    <p>Enter your email. The response is the same whether or not an eligible account exists.</p>
    <form id="forgotForm">
      <label for="email">Email</label><input id="email" name="email" type="email" maxlength="254" required autocomplete="email">
      <button class="btn btn-primary" type="submit">Request reset link</button>
    </form>
    <p id="forgotStatus" role="status" aria-live="polite"></p>
    <p><a href="/login">Return to sign in</a></p>
  </section></main>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', function (event) {
      event.preventDefault();
      var button = event.currentTarget.querySelector('button');
      button.disabled = true;
      fetch('/api/auth/forgot-password', {
        method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value })
      }).then(function (response) { return response.json().then(function (body) {
        if (!response.ok) throw new Error(body.error || 'Request failed');
        document.getElementById('forgotStatus').textContent = body.message;
      }); }).catch(function () {
        document.getElementById('forgotStatus').textContent = 'The request could not be completed. Try again later.';
      }).finally(function () { button.disabled = false; });
    });
  </script>
</body>
</html>
