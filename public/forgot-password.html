<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | NorthStar</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/site-professionalism.css">
</head>
<body class="account-auth-page">
  <header class="account-auth-brand" aria-label="NorthStar">
    <a href="/"><img src="/assets/logo.png" alt=""><span>NorthStar</span></a>
  </header>
  <main class="account-auth-shell">
    <section class="account-auth-card" aria-labelledby="forgotTitle">
      <p class="account-auth-eyebrow">NorthStar account</p>
      <h1 id="forgotTitle">Reset your password</h1>
      <p class="account-auth-support">Enter your email and we&rsquo;ll queue password-reset instructions if the account is eligible. Delivery time depends on your email provider.</p>
      <form id="forgotForm" class="account-auth-form">
        <div class="account-auth-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" maxlength="254" required autocomplete="email" inputmode="email">
        </div>
        <button class="btn btn-primary" type="submit">Request reset link</button>
      </form>
      <p id="forgotStatus" class="account-auth-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <p class="account-auth-return"><a href="/login">Return to sign in</a></p>
    </section>
  </main>
  <footer class="footer"><div class="footer-links"><a href="/">Home</a><a href="/contact">Support</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div><p>© 2026 NorthStar Solutions LLC. All rights reserved.</p></footer>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', function (event) {
      event.preventDefault();
      var form = event.currentTarget;
      var button = form.querySelector('button');
      var status = document.getElementById('forgotStatus');
      var originalLabel = button.textContent;
      button.disabled = true;
      button.textContent = 'Sending…';
      form.setAttribute('aria-busy', 'true');
      status.removeAttribute('data-state');
      status.textContent = '';
      fetch('/api/auth/forgot-password', {
        method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value })
      }).then(function (response) { return response.json().then(function (body) {
        if (!response.ok) throw new Error(body.error || 'Request failed');
        status.setAttribute('data-state', 'success');
        status.textContent = body.message;
      }); }).catch(function () {
        status.setAttribute('data-state', 'error');
        status.textContent = 'The request could not be completed. Try again later.';
      }).finally(function () {
        button.disabled = false;
        button.textContent = originalLabel;
        form.removeAttribute('aria-busy');
      });
    });
  </script>
</body>
</html>
