<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="northstar-canonical-surfaces" content="customer-detail estimates">
  <script src="/js/canonical-intelligence.js"></script>
  <script src="/js/polaris-api.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Details — NorthStar Solutions</title>
  <script src="/js/theme.js"></script>
  <script src="/js/transcript-renderer.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .lead-detail-container { max-width: 960px; margin: 0 auto; padding: 24px; }
    .lead-detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .lead-detail-title { font-size: 24px; font-weight: 700; color: var(--neutral-900); }
    .lead-detail-subtitle { font-size: 14px; color: var(--neutral-500); margin-top: 4px; }
    .lead-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    @media (max-width: 640px) { .lead-detail-grid { grid-template-columns: 1fr; } }
    .lead-detail-card { background: var(--neutral-50); border: 1px solid var(--neutral-200); border-radius: var(--radius); padding: 16px; }
    .lead-detail-card h3 { font-size: 13px; font-weight: 600; color: var(--neutral-500); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .lead-detail-card .value { font-size: 16px; font-weight: 600; color: var(--neutral-900); }
    .lead-detail-card .value-secondary { font-size: 14px; color: var(--neutral-600); margin-top: 2px; }
    .lead-detail-section { margin-bottom: 24px; }
    .lead-detail-section h2 { font-size: 16px; font-weight: 600; color: var(--neutral-900); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--neutral-200); }
    .lead-timeline { list-style: none; padding: 0; }
    .lead-timeline li { padding: 8px 0; border-bottom: 1px solid var(--neutral-100); display: flex; gap: 8px; font-size: 14px; }
    .lead-timeline .time { color: var(--neutral-400); font-size: 12px; white-space: nowrap; min-width: 80px; }
    .lead-timeline .event { color: var(--neutral-700); }
    .lead-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 768px) { .lead-detail-container { padding: 16px; } }
    /* Customer Intelligence styles */
    .ci-summary { background: var(--neutral-50); border: 1px solid var(--neutral-200); border-radius: var(--radius); padding: 16px; line-height: 1.6; }
    .ci-score-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .ci-score-bar-fill { height: 8px; border-radius: 4px; flex: 1; }
    .ci-score-value { font-size: 18px; font-weight: 700; min-width: 36px; }
    .ci-score-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .ci-score-exceptional { color: var(--success); } .ci-score-high { color: var(--brand-600); } .ci-score-moderate { color: var(--warning); } .ci-score-low { color: var(--danger); }
    .ci-risk-critical { color: #991b1b; } .ci-risk-high { color: #c2410c; } .ci-risk-medium { color: #b45309; } .ci-risk-low { color: var(--success); }
    .ci-action-item { padding: 8px 0; border-bottom: 1px solid var(--neutral-100); }
    .ci-action-item:last-child { border-bottom: none; }
    .ci-action-rank { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; font-size: 11px; font-weight: 700; color: #fff; margin-right: 8px; }
    .ci-action-rank-1 { background: var(--brand-600); } .ci-action-rank-2 { background: var(--brand-500); }
    .ci-action-rank-3 { background: var(--brand-400); } .ci-action-rank-4 { background: var(--neutral-400); }
    .ci-action-rank-5 { background: var(--neutral-300); color: var(--neutral-600); }
    .ci-timeline-item { padding: 6px 0; border-bottom: 1px solid var(--neutral-100); display: flex; gap: 8px; font-size: 13px; }
    .ci-timeline-item:last-child { border-bottom: none; }
    .ci-timeline-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .ci-placeholder { background: var(--neutral-50); border: 1px dashed var(--neutral-300); border-radius: var(--radius); padding: 16px; text-align: center; color: var(--neutral-400); font-size: 13px; }
  </style>
  <script src="/js/auth-session.js"></script>
  <script src="/js/trial-status.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" aria-label="Primary navigation"></aside>
    <main class="main-content" id="mainContent">
      <div class="lead-detail-container" id="leadDetailContainer">
        <div style="text-align:center;padding:60px 20px;color:var(--neutral-400);" id="loadingState">
          <div style="font-size:32px;margin-bottom:12px;">⏳</div>
          <div>Loading lead details...</div>
        </div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/js/event-bus.js"></script>
  <script src="/js/communications-engine.js"></script>
  <script src="/js/business-models.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/notification-service.js"></script>
  <script src="/js/tooltip-service.js"></script>
  <script src="/js/status-pill.js"></script>
  <script src="/js/customer-card.js"></script>
  <script src="/js/polaris-engine.js"></script>
  <script src="/js/polaris-m13-bridge.js"></script>
  <script src="/js/polaris-ui.js"></script>
  <script src="/js/analytics-engine.js"></script>
  <script src="/js/app-store.js"></script>
  <script src="/js/nav-component.js"></script>
  <script>
    (function() {
      if (window.NavComponent && typeof window.NavComponent.init === 'function') {
        NavComponent.init("leads");
      }

      function getQueryParam(name) {
        var url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      function loadLead() {
        var leadId = getQueryParam('id');
        if (!leadId) {
          document.getElementById('loadingState').innerHTML = '<div style="font-size:32px;margin-bottom:12px;">🔍</div><div>No lead ID specified. <a href="/dashboard/leads" style="color:var(--brand-600);">Back to leads</a></div>';
          return;
        }

        PolarisApi.getOpportunities({ limit: 100 }).then(function(result) {
          var records = result.opportunities || [];
          var record = records.find(function(candidate) {
            var ids = candidate.canonical && candidate.canonical.ids;
            return ids && Object.keys(ids).some(function(key) { return ids[key] === leadId; });
          });
          var lead = PolarisApi.normalizeLead(record);
          if (!lead) throw new Error('not found');
          lead.caller = lead.callerName;
          lead.avgPrice = lead.estimatedPrice;
          renderLead(lead);
        }).catch(function() {
          document.getElementById('loadingState').innerHTML = '<div style="font-size:32px;margin-bottom:12px;">😕</div><div>Lead not found. <a href="/dashboard/leads" style="color:var(--brand-600);">Back to leads</a></div>';
        });
      }

      function renderLead(lead) {
        var container = document.getElementById('leadDetailContainer');
        var name = lead.caller || lead.customerName || 'Unknown';
        var service = lead.service || lead.serviceRequested || '—';
        var price = lead.avgPrice === null || lead.avgPrice === undefined ? '—' : '$' + String(lead.avgPrice);
        var phone = lead.phone || lead.phoneNumber || '—';
        var status = lead.status || 'new';
        var statusBadge = (typeof CustomerCard !== 'undefined') ? CustomerCard.getStatusBadge(status) : '<span class="call-status-badge answered">' + status + '</span>';
        var receivedAt = lead.receivedAt ? new Date(lead.receivedAt).toLocaleString() : '—';
        var updatedAt = lead.updatedAt ? new Date(lead.updatedAt).toLocaleString() : '—';
        var address = lead.address || lead.jobAddress || '—';
        var duration = lead.duration || '—';
        var outcome = lead.outcome || '—';
        var transcript = lead.transcript || '';
        var summary = lead.summary || '';

        // Canonical Polaris data is projected from PostgreSQL by AppStore.
        var polarisData = lead.canonical || null;

        container.innerHTML = '' +
          '<div class="lead-detail-header">' +
            '<div>' +
              '<div class="lead-detail-title"><span id="leadCustomerName"></span> ' + statusBadge + '</div>' +
              '<div class="lead-detail-subtitle">' + service + ' · ' + price + ' · ' + phone + '</div>' +
            '</div>' +
            '<div class="lead-actions">' +
              '<a href="/dashboard/leads" class="btn btn-secondary btn-sm">← Back to Leads</a>' +
              '<button class="btn btn-primary btn-sm" onclick="window.location.href=\'/dashboard/communications\'">📞 Contact</button>' +
            '</div>' +
          '</div>' +

          '<div class="lead-detail-grid">' +
            '<div class="lead-detail-card"><h3>Status</h3><div class="value">' + statusBadge + '</div></div>' +
            '<div class="lead-detail-card"><h3>Service</h3><div class="value">' + service + '</div><div class="value-secondary">' + (lead.jobDetail || '') + '</div></div>' +
            '<div class="lead-detail-card"><h3>Estimated Value</h3><div class="value" style="color:var(--brand-600);">' + price + '</div></div>' +
            '<div class="lead-detail-card"><h3>Outcome</h3><div class="value" style="text-transform:capitalize;">' + outcome + '</div></div>' +
            '<div class="lead-detail-card"><h3>Phone</h3><div class="value">' + phone + '</div></div>' +
            '<div class="lead-detail-card"><h3>Address</h3><div class="value">' + address + '</div></div>' +
            '<div class="lead-detail-card"><h3>Duration</h3><div class="value">' + duration + '</div></div>' +
            '<div class="lead-detail-card"><h3>Lead ID</h3><div class="value" style="font-size:13px;font-family:monospace;">' + (lead.id || '—') + '</div></div>' +
            '<div class="lead-detail-card"><h3>Received</h3><div class="value">' + receivedAt + '</div></div>' +
            '<div class="lead-detail-card"><h3>Last Updated</h3><div class="value">' + updatedAt + '</div></div>' +
          '</div>' +

          '<div class="lead-detail-section">' +
            '<div id="polarisContainer"></div>' +
          '</div>' +
          (summary ? '<div class="lead-detail-section"><h2>Summary</h2><div class="lead-detail-card"><div class="value-secondary">' + summary + '</div></div></div>' : '') +

          (transcript ? '<div class="lead-detail-section"><h2>Transcript</h2><div class="lead-detail-card"><div id="leadTranscriptBody" class="value-secondary" style="white-space:pre-wrap;max-height:300px;overflow-y:auto;font-size:13px;line-height:1.6;"></div></div></div>' : '') +

          // Executive Summary (from Retell webhook post-call pipeline)
          (function() {
            var es = lead.executiveSummary;
            if (!es) return '';
            var sentimentColor = es.sentiment === 'positive' ? 'var(--success)' : es.sentiment === 'negative' || es.sentiment === 'frustrated' ? 'var(--danger)' : 'var(--warning)';
            var polarisBadge = '';
            if (es.polarisOpportunityScore) {
              var ps = es.polarisOpportunityScore;
              polarisBadge = '<span style="display:inline-block;padding:4px 10px;border-radius:100px;font-size:12px;font-weight:600;background:' + (ps.placeholder ? '#fef3c7' : '#dcfce7') + ';color:' + (ps.placeholder ? '#92400e' : '#166534') + ';">⭐ POLARIS Score: ' + ps.score + (ps.placeholder ? ' (pending)' : '') + '</span>';
            }
            var keyTopicChips = '';
            if (es.keyTopics && es.keyTopics.length > 0) {
              keyTopicChips = '<div style="margin-bottom:8px;"><strong>Key Topics:</strong> ' + es.keyTopics.map(function(t){return '<span style="display:inline-block;padding:2px 8px;margin:2px;background:var(--neutral-100);border-radius:100px;font-size:12px;">' + t + '</span>';}).join('') + '</div>';
            }
            var actionItemsHtml = '';
            if (es.actionItems && es.actionItems.length > 0) {
              actionItemsHtml = '<div class="lead-detail-section"><h2>✅ Action Items</h2><div class="lead-detail-card"><ul style="list-style:none;padding:0;margin:0;">';
              es.actionItems.forEach(function(a) {
                var prioColor = a.priority === 'high' ? 'var(--danger)' : a.priority === 'medium' ? 'var(--warning)' : 'var(--neutral-400)';
                actionItemsHtml += '<li style="padding:4px 0;font-size:13px;border-bottom:1px solid var(--neutral-100);"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + prioColor + ';margin-right:8px;"></span>' + a.description + '</li>';
              });
              actionItemsHtml += '</ul></div></div>';
            }
            var recsHtml = '';
            if (es.recommendations && es.recommendations.length > 0) {
              recsHtml = '<div class="lead-detail-section"><h2>💡 Recommendations</h2><div class="lead-detail-card">';
              es.recommendations.forEach(function(r) {
                recsHtml += '<div style="font-size:13px;padding:3px 0;">📌 <strong>' + r.action + '</strong>: ' + r.description + '</div>';
              });
              recsHtml += '</div></div>';
            }
            return '<div class="lead-detail-section">' +
              '<h2>📋 Executive Summary</h2>' +
              '<div class="lead-detail-card">' +
                '<div style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
                  '<span style="font-weight:600;">' + (es.callOutcome || es.outcome || 'Call completed') + '</span>' +
                  (polarisBadge || '') +
                '</div>' +
                '<div style="font-size:14px;color:var(--neutral-600);margin-bottom:8px;">' +
                  '<strong>Sentiment:</strong> <span style="color:' + sentimentColor + ';text-transform:capitalize;">' + (es.sentiment || 'neutral') + '</span>' +
                  (es.customerName ? ' · <strong>Customer:</strong> ' + es.customerName : '') +
                  (es.serviceRequested ? ' · <strong>Service:</strong> ' + es.serviceRequested : '') +
                  (es.durationFormatted ? ' · <strong>Duration:</strong> ' + es.durationFormatted : '') +
                '</div>' +
                keyTopicChips +
                (es.appointmentRequested ? '<div style="font-size:14px;color:var(--brand-600);margin-bottom:4px;">📅 Appointment requested for: ' + (es.preferredTime || 'customer-preferred time') + '</div>' : '') +
                '<div style="font-size:13px;color:var(--neutral-500);margin-top:4px;">' +
                  '<em>Generated: ' + new Date(es.generatedAt).toLocaleString() + '</em>' +
                '</div>' +
              '</div>' +
            '</div>' + actionItemsHtml + recsHtml;
          })() +

          '<div class="lead-detail-section">' +
            '<h2>Activity</h2>' +
            '<div class="lead-detail-card">' +
              '<ul class="lead-timeline">' +
                '<li><span class="time">' + receivedAt + '</span><span class="event">Lead created</span></li>' +
                (lead.updatedAt ? '<li><span class="time">' + updatedAt + '</span><span class="event">Lead updated</span></li>' : '') +
              '</ul>' +
            '</div>' +
          '</div>' +

          '<div class="lead-detail-section">' +
            '<h2>🧠 AI Customer Intelligence</h2>' +
            '<div id="customerIntelligenceContainer">' +
              '<div class="ci-placeholder">Loading customer intelligence...</div>' +
            '</div>' +
          '</div>' +

          '<div class="lead-detail-section">' +
            '<h2>📋 Future Intelligence</h2>' +
            '<div class="lead-detail-grid" style="grid-template-columns:1fr 1fr;">' +
              '<div class="ci-placeholder" style="padding:20px;">📞 Retell Transcript Intelligence<br><span style="font-size:11px;">Coming in Mission 17</span></div>' +
              '<div class="ci-placeholder" style="padding:20px;">💰 Estimate Intelligence<br><span style="font-size:11px;">Coming in Mission 18</span></div>' +
              '<div class="ci-placeholder" style="padding:20px;">📅 Scheduling Intelligence<br><span style="font-size:11px;">Coming in Mission 19</span></div>' +
              '<div class="ci-placeholder" style="padding:20px;">📊 Production Intelligence<br><span style="font-size:11px;">Coming in Mission 20</span></div>' +
            '</div>' +
          '</div>';

        var leadCustomerName = document.getElementById('leadCustomerName');
        if (leadCustomerName) leadCustomerName.textContent = name;
        var transcriptBody = document.getElementById('leadTranscriptBody');
        if (transcriptBody) {
          window.NorthStarTranscriptRenderer.render(transcriptBody, transcript, {
            presentation: 'plain',
            scroll: 'top',
            live: 'polite'
          });
        }

        var pc = document.getElementById('polarisContainer');
        renderCanonicalProjection(pc, polarisData);
        fetchCustomerIntelligence(lead);
      }

      function renderCanonicalProjection(container, canonical) {
        if (!container) return;
        container.replaceChildren();
        var presentation = window.PolarisEngine && window.PolarisEngine.selectPresentation(canonical);
        if (!presentation) {
          var unavailable = document.createElement('div');
          unavailable.className = 'ci-placeholder';
          unavailable.textContent = 'Canonical intelligence unavailable.';
          container.appendChild(unavailable);
          return;
        }
        var title = document.createElement('h2');
        title.textContent = 'Canonical Polaris';
        container.appendChild(title);
        var card = document.createElement('div');
        card.className = 'lead-detail-card';
        [
          ['Customer price', presentation.customerPrice],
          ['Scope', presentation.service && presentation.service.scope],
          ['Labor', { charge: presentation.values.laborCharge, knownInternalCost: presentation.values.knownInternalLaborCost, productionHours: presentation.values.estimatedProductionDurationHours }],
          ['Travel', presentation.values.travel],
          ['Profit', { gross: presentation.grossProfit, grossMarginPercent: presentation.grossMarginPercent, net: presentation.netProfit, netMarginPercent: presentation.netMarginPercent }],
          ['Confidence', presentation.confidence],
          ['Risk', presentation.risk],
          ['Recommendations', presentation.recommendations],
          ['Snapshot digest', canonical.snapshotDigest],
        ].forEach(function (entry) {
          var row = document.createElement('div');
          row.style.marginBottom = '8px';
          var label = document.createElement('strong');
          label.textContent = entry[0] + ': ';
          var value = document.createElement('span');
          value.textContent = typeof entry[1] === 'object'
            ? JSON.stringify(entry[1])
            : String(entry[1] === null || entry[1] === undefined ? 'not calculated' : entry[1]);
          row.appendChild(label);
          row.appendChild(value);
          card.appendChild(row);
        });
        container.appendChild(card);
      }

      function fetchCustomerIntelligence(lead) {
        if (!lead) return;
        var ciContainer = document.getElementById('customerIntelligenceContainer');
        if (!ciContainer) return;
        renderCanonicalProjection(ciContainer, lead.canonical || null);
      }

      function renderCustomerIntelligence(container, ci) {
        if (!container || !ci) return;

        // Score colors
        var oppClass = ci.opportunityLevel === 'Exceptional' ? 'ci-score-exceptional' :
          ci.opportunityLevel === 'High' ? 'ci-score-high' :
          ci.opportunityLevel === 'Moderate' ? 'ci-score-moderate' : 'ci-score-low';
        var riskClass = ci.riskLevel === 'Critical' ? 'ci-risk-critical' :
          ci.riskLevel === 'High' ? 'ci-risk-high' :
          ci.riskLevel === 'Medium' ? 'ci-risk-medium' : 'ci-risk-low';

        // Opportunity bar color
        var oppBarColor = ci.opportunityScore >= 70 ? 'var(--success)' :
          ci.opportunityScore >= 50 ? 'var(--brand-500)' :
          ci.opportunityScore >= 30 ? 'var(--warning)' : 'var(--danger)';

        // Risk bar color
        var riskBarColor = ci.riskLevel === 'Critical' ? '#991b1b' :
          ci.riskLevel === 'High' ? '#c2410c' :
          ci.riskLevel === 'Medium' ? '#b45309' : 'var(--success)';

        // Timeline
        var timelineHtml = '';
        if (ci.timeline && ci.timeline.length > 0) {
          var dotColors = { 'lead-captured': 'var(--brand-500)', 'status-change': 'var(--warning)', 'outcome': 'var(--success)', 'estimate': 'var(--info)' };
          ci.timeline.forEach(function(t) {
            var dotColor = dotColors[t.type] || 'var(--neutral-400)';
            timelineHtml += '<div class="ci-timeline-item">' +
              '<div class="ci-timeline-dot" style="background:' + dotColor + ';"></div>' +
              '<div><div style="font-weight:500;">' + t.event + '</div>' +
              '<div style="font-size:11px;color:var(--neutral-400);">' + new Date(t.date).toLocaleString() + '</div></div></div>';
          });
        } else {
          timelineHtml = '<div style="color:var(--neutral-400);font-size:13px;padding:8px 0;">No timeline events available.</div>';
        }

        // Recommended actions
        var actionsHtml = '';
        if (ci.recommendedActions && ci.recommendedActions.length > 0) {
          ci.recommendedActions.forEach(function(a) {
            var rankClass = 'ci-action-rank-' + Math.min(a.rank, 5);
            actionsHtml += '<div class="ci-action-item">' +
              '<span class="ci-action-rank ' + rankClass + '">' + a.rank + '</span>' +
              '<strong>' + a.action + '</strong>' +
              '<div style="font-size:12px;color:var(--neutral-500);margin-top:2px;">' + a.reason.slice(0, 120) + (a.reason.length > 120 ? '...' : '') + '</div></div>';
          });
        } else {
          actionsHtml = '<div style="color:var(--neutral-400);font-size:13px;padding:8px 0;">No recommendations available.</div>';
        }

        // Opportunity reasoning
        var oppReasoningHtml = '';
        if (ci.opportunityReasoning && ci.opportunityReasoning.length > 0) {
          oppReasoningHtml = '<div style="margin-top:8px;">';
          ci.opportunityReasoning.forEach(function(r) {
            oppReasoningHtml += '<div style="font-size:12px;color:var(--neutral-600);padding:2px 0;">• ' + r + '</div>';
          });
          oppReasoningHtml += '</div>';
        }

        // Risk reasons
        var riskReasonsHtml = '';
        if (ci.riskReasons && ci.riskReasons.length > 0) {
          riskReasonsHtml = '<div style="margin-top:8px;">';
          ci.riskReasons.forEach(function(r) {
            riskReasonsHtml += '<div style="font-size:12px;color:var(--neutral-600);padding:2px 0;">⚠ ' + r + '</div>';
          });
          riskReasonsHtml += '</div>';
        }

        container.innerHTML = '' +
          // Executive Summary
          '<div class="lead-detail-card" style="margin-bottom:16px;">' +
            '<h3>AI Executive Summary</h3>' +
            '<div class="ci-summary">' + (ci.executiveSummary || 'No summary available.') + '</div>' +
          '</div>' +

          // Score Row
          '<div class="lead-detail-grid">' +
            '<div class="lead-detail-card">' +
              '<h3>Opportunity Score</h3>' +
              '<div class="ci-score-bar">' +
                '<span class="ci-score-value ' + oppClass + '">' + ci.opportunityScore + '</span>' +
                '<div class="ci-score-bar-fill" style="background:var(--neutral-200);">' +
                  '<div class="ci-score-bar-fill" style="width:' + ci.opportunityScore + '%;background:' + oppBarColor + ';height:100%;"></div>' +
                '</div>' +
              '</div>' +
              '<div class="ci-score-label ' + oppClass + '">' + (ci.opportunityLevel || 'Unknown') + '</div>' +
              oppReasoningHtml +
            '</div>' +
            '<div class="lead-detail-card">' +
              '<h3>Risk Score</h3>' +
              '<div class="ci-score-bar">' +
                '<span class="ci-score-value ' + riskClass + '">' + ci.riskScore + '</span>' +
                '<div class="ci-score-bar-fill" style="background:var(--neutral-200);">' +
                  '<div class="ci-score-bar-fill" style="width:' + ci.riskScore + '%;background:' + riskBarColor + ';height:100%;"></div>' +
                '</div>' +
              '</div>' +
              '<div class="ci-score-label ' + riskClass + '">' + (ci.riskLevel || 'Unknown') + '</div>' +
              riskReasonsHtml +
            '</div>' +
          '</div>' +

          // Snapshot Grid
          '<div class="lead-detail-grid">' +
            '<div class="lead-detail-card"><h3>Revenue</h3><div class="value" style="color:var(--brand-600);">$' + (ci.snapshot.estimatedRevenue || 0).toLocaleString() + '</div></div>' +
            '<div class="lead-detail-card"><h3>Profit</h3><div class="value" style="color:var(--success);">$' + (ci.snapshot.estimatedProfit || 0).toLocaleString() + ' (' + (ci.snapshot.profitMargin || '0%') + ')</div></div>' +
            '<div class="lead-detail-card"><h3>Labor Cost</h3><div class="value">$' + (ci.snapshot.estimatedLabor || 0).toLocaleString() + '</div></div>' +
            '<div class="lead-detail-card"><h3>Crew Needed</h3><div class="value">' + (ci.snapshot.recommendedCrew || '\u2014') + ' technicians</div></div>' +
            '<div class="lead-detail-card"><h3>Production Hours</h3><div class="value">' + (ci.snapshot.estimatedProductionHours || '\u2014') + ' hrs</div></div>' +
            '<div class="lead-detail-card"><h3>Travel</h3><div class="value">' + (ci.snapshot.travelMinutes || '\u2014') + ' min ($' + (ci.snapshot.travelCost || 0).toFixed(2) + ')</div></div>' +
            '<div class="lead-detail-card"><h3>Confidence</h3><div class="value">' + (ci.snapshot.confidenceScore || '\u2014') + '%</div><div class="value-secondary">' + (ci.snapshot.confidenceLabel || '') + '</div></div>' +
            '<div class="lead-detail-card"><h3>Profit per Hour</h3><div class="value" style="color:var(--brand-600);">$' + (ci.snapshot.profitPerLaborHour || 0).toFixed(2) + '/hr</div></div>' +
          '</div>' +

          // Next Best Action
          '<div class="lead-detail-card" style="margin-bottom:16px;">' +
            '<h3>Next Best Action</h3>' +
            '<div class="value" style="font-size:16px;margin-bottom:4px;">' + (ci.nextBestAction || 'Review') + '</div>' +
            '<div class="value-secondary">Priority: ' + ci.priorityLabel + ' (' + ci.priorityScore + '/100) \u00b7 Escalation: ' + (ci.escalationLevel || 'this-week') + '</div>' +
            '<div class="value-secondary" style="margin-top:4px;">Business Impact: ' + (ci.businessImpact || 'Unknown') + ' \u00b7 ' + (ci.recommendationStrength || '') + '</div>' +
          '</div>' +

          // Recommended Actions
          '<div class="lead-detail-card" style="margin-bottom:16px;">' +
            '<h3>Recommended Actions</h3>' +
            actionsHtml +
          '</div>' +

          // Timeline
          '<div class="lead-detail-card" style="margin-bottom:16px;">' +
            '<h3>Customer Timeline</h3>' +
            timelineHtml +
          '</div>' +

          // Confidence Reason
          (ci.snapshot.confidenceReason ? '<div class="lead-detail-card" style="margin-bottom:16px;">' +
            '<h3>Confidence Reasoning</h3>' +
            '<div class="value-secondary">' + ci.snapshot.confidenceReason + '</div>' +
          '</div>' : '');
      }


  function renderEstimatePanel(estimate) {
    if (!estimate || !estimate.items) {
      return '<div class="lead-detail-section" id="estimateSection">' +
        '<h2>Line-Item Estimate</h2>' +
        '<div class="lead-detail-card">' +
        '<div style="text-align:center;padding:20px;color:var(--neutral-400);">' +
        'Not enough data for a detailed estimate. Add service type, description, and address.' +
        '</div></div></div>';
    }

    var itemRows = estimate.items.map(function(item) {
      var typeLabel = item.type.charAt(0).toUpperCase() + item.type.slice(1);
      return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--neutral-100);font-size:13px;">' +
        '<div><span style="font-weight:500;">' + typeLabel + '</span>' +
        (item.description ? '<div style="font-size:11px;color:var(--neutral-500);">' + item.description + '</div>' : '') +
        '</div>' +
        '<div style="font-weight:500;white-space:nowrap;">$' + item.amount.toFixed(2) + '</div>' +
        '</div>';
    }).join('');

    var upsellRows = '';
    if (estimate.upsells && estimate.upsells.length > 0) {
      upsellRows = '<div style="margin-top:12px;padding-top:8px;border-top:2px solid var(--brand-100);">' +
        '<div style="font-size:12px;font-weight:600;color:var(--brand-600);margin-bottom:6px;">Recommended Add-ons</div>';
      estimate.upsells.forEach(function(u) {
        upsellRows += '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;">' +
          '<div><span>' + u.label + '</span><div style="font-size:11px;color:var(--neutral-500);">' + u.description + '</div></div>' +
          '<span style="font-weight:500;">$' + u.amount.toFixed(2) + '</span></div>';
      });
      upsellRows += '</div>';
    }

    var totalRow = '<div style="display:flex;justify-content:space-between;padding:8px 0;margin-top:4px;border-top:2px solid var(--neutral-300);font-size:16px;font-weight:700;">' +
      '<span>Total</span><span style="color:var(--brand-600);">$' + estimate.total.toFixed(2) + '</span></div>';

    var confClass = estimate.confidenceLabel ? estimate.confidenceLabel.toLowerCase() : 'low';
    var badgeStyle = confClass === 'high' ? 'background:#dcfce7;color:#166534;' : 
                     confClass === 'medium' ? 'background:#fef3c7;color:#92400e;' :
                     'background:#fee2e2;color:#991b1b;';

    return '<div class="lead-detail-section" id="estimateSection">' +
      '<h2>Line-Item Estimate</h2>' +
      '<div class="lead-detail-card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
      '<div><span style="font-size:13px;font-weight:500;">' + estimate.service + '</span>' +
      '<span style="font-size:11px;color:var(--neutral-500);margin-left:8px;">' + estimate.difficultyLabel + '</span></div>' +
      '<span style="font-size:11px;padding:2px 8px;border-radius:4px;' + badgeStyle + '">' +
      estimate.confidenceLabel + ' (' + estimate.confidence + '%)' +
      '</span></div>' +
      itemRows +
      totalRow +
      upsellRows +
      '<div style="margin-top:10px;padding:8px;background:var(--neutral-50);border-radius:4px;font-size:11px;color:var(--neutral-600);line-height:1.5;">' +
      '<strong>AI Reasoning:</strong> ' + estimate.reasoning +
      '</div>' +
      '</div></div>';
  }

      // renderLeadDetail — re-renders the lead after M13 intelligence is augmented
      function renderLeadDetail(lead) {
        if (lead && document.getElementById('leadDetailContainer')) {
          renderLead(lead);
        }
      }

      // Load on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadLead);
      } else {
        loadLead();
      }
    })();
  </script>
